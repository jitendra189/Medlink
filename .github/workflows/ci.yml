name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: medlink_test
          POSTGRES_USER: medlink_user
          POSTGRES_PASSWORD: medlink_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo lint

      - name: Typecheck
        run: pnpm turbo typecheck

      - name: Build shared package
        run: pnpm --filter @medlink/shared build

      - name: Database migration smoke test
        run: pnpm --filter @medlink/api migration:run
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_NAME: medlink_test
          DATABASE_USER: medlink_user
          DATABASE_PASSWORD: medlink_pass
          DB_SYNCHRONIZE: 'false'
          NODE_ENV: test

      - name: Test
        run: pnpm turbo test
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_NAME: medlink_test
          DATABASE_USER: medlink_user
          DATABASE_PASSWORD: medlink_pass
          JWT_SECRET: test_secret_for_ci_only_not_production
          NODE_ENV: test

      - name: Build
        run: pnpm turbo build

      - name: Build API Docker image
        run: docker build --tag medlink-api:ci -f apps/api/Dockerfile .

      - name: Build web Docker image
        run: docker build --tag medlink-web:ci -f apps/web/Dockerfile .
