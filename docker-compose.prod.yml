version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    image: ghcr.io/jitendra189/medlink-api:latest
    restart: always
    ports:
      - '3000:3000'
    env_file: .env
    environment:
      DATABASE_HOST: postgres
      NODE_ENV: production
    depends_on:
      - postgres

volumes:
  postgres_data:
